# Apply ONLY to the source workload cluster (workload01), same scope as
# checkpoint-agent-daemonset.yaml - restore on a target cluster is just a
# normal pod scheduling against the pre-pulled image, it never calls the
# source cluster's kubelet checkpoint API, so target clusters don't need this:
#   kubectl apply -f deploy/checkpoint-sa-rbac.yaml --kubeconfig workload01.kubeconfig
#
# checkpoint_controller.go (running on the mgmt-cluster) fetches a token for
# this ServiceAccount FROM the source workload cluster (getKubeletToken /
# checkpoint_saName="checkpoint-sa", checkpoint_saNamespace="default") and
# uses it to call that cluster's kubelet checkpoint API directly. Without this
# on the workload cluster, checkpointing fails at the token-fetch step before
# it ever reaches CRIU.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkpoint-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: checkpoint-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods/checkpoint"]
    verbs: ["patch", "create", "update", "proxy"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: checkpoint-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: checkpoint-sa
    namespace: default
roleRef:
  kind: Role
  name: checkpoint-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: checkpoint-sa-nodes-checkpoint
rules:
  - apiGroups: [""]
    resources: ["nodes/checkpoint"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["create", "get"]


---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: checkpoint-sa-nodes-checkpoint-binding
subjects:
  - kind: ServiceAccount
    name: checkpoint-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: checkpoint-sa-nodes-checkpoint
  apiGroup: rbac.authorization.k8s.io