apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: transition-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: transition-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: transition-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: transition-operator
    spec:
      # Pinned to sre-control (192.168.28.158) - this must match the IP
      # hardcoded in checkpoint-agent's CONTROLLER_URL and the mgmt-cluster
      # apiserver endpoint. Combined with metrics_service.yaml's
      # externalTrafficPolicy: Local, this keeps heartbeat traffic on a single
      # node so kube-proxy/Cilium never SNATs it to an internal pod-CIDR
      # address before the operator sees it - otherwise RemoteAddr comes
      # through as a 10.0.0.0/8 Cilium address instead of the real workload
      # cluster node IP (verified empirically: pod landed on sre-worker01
      # while traffic targeted sre-control, and heartbeat.NodeName ended up
      # as an internal 10.0.0.x address instead of the real 192.168.28.110).
      nodeSelector:
        kubernetes.io/hostname: sre-control
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # NOT the "restricted" Pod Security Standards default anymore.
        # Rootless buildah (from/add/commit) needs unshare(CLONE_NEWUSER),
        # CAP_SYS_CHROOT, and a remount(MS_PRIVATE) of "/" during layer
        # apply. Verified directly on this cluster (throwaway Jobs on
        # sre-control, same image): RuntimeDefault seccomp blocks the
        # unshare unconditionally even for root; switching to Unconfined
        # plus individually-added capabilities (SETUID/SETGID/SYS_ADMIN)
        # still failed the remount step with "permission denied" - that's
        # containerd/runc's mount-propagation setup for unprivileged
        # containers, not something any single capability grants back.
        # Only privileged: true (below) got a clean run. Acceptable here:
        # this is a single-tenant mgmt-cluster, not a shared/multi-tenant one.
        runAsNonRoot: false
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        imagePullPolicy: Always

        env:
        # MinIO
        - name: MINIO_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ENDPOINT

        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ACCESS_KEY

        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_SECRET_KEY

        - name: MINIO_BUCKET
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_BUCKET

        # Registry
        - name: REPOSITORY
          valueFrom:
            secretKeyRef:
              name: reg-credentials
              key: username

        - name: REGISTRY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: reg-credentials
              key: password

        - name: REGISTRY_URL
          valueFrom:
            secretKeyRef:
              name: reg-credentials
              key: registry

        # Registry secret refs
        - name: SECRET_NAME_REF
          value: "reg-credentials"

        - name: SECRET_NAMESPACE_REF
          value: "default"

        # Git
        - name: GIT_SERVER_URL
          valueFrom:
            secretKeyRef:
              name: git-secret
              key: GIT_SERVER_URL

        - name: GIT_SECRET_NAME
          valueFrom:
            secretKeyRef:
              name: git-secret
              key: GIT_SECRET_NAME

        - name: GIT_SECRET_NAMESPACE
          valueFrom:
            secretKeyRef:
              name: git-secret
              key: GIT_SECRET_NAMESPACE

        # Heartbeat
        - name: HEARTBEAT_FAULT_DELAY
          value: "15"

        # Namespace
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace

        # AI-assisted failover approval (kagent) - unset KAGENT_AGENT_NAME to
        # disable and fall back to fully-automatic behavior.
        - name: KAGENT_AGENT_NAME
          value: "failover-agent"
        - name: KAGENT_AGENT_NAMESPACE
          value: "kagent"
        - name: KAGENT_URL
          value: "http://kagent-controller.kagent.svc.cluster.local:8083"

        ports:
        - containerPort: 8443
          name: https
          protocol: TCP

        - containerPort: 8090
          name: heartbeat
          protocol: TCP
        securityContext:
          # See the pod-level securityContext comment above - granular
          # capabilities (SETUID/SETGID/SYS_ADMIN/SYS_CHROOT) were tried and
          # verified insufficient on this cluster's containerd/runc; only
          # privileged got a clean buildah from/add/commit run.
          privileged: true
          runAsUser: 0
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
